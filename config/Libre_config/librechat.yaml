# For more information, see the Configuration Guide:
# https://docs.librechat.ai/install/configuration/custom_config.html

# Configuration version (required)
version: 1.2.1

# Cache settings: Set to true to enable caching
cache: true

# Custom interface configuration
interface:
  # Privacy policy settings
  privacyPolicy:
    externalUrl: 'https://librechat.ai/privacy-policy'
    openNewTab: true

  # Terms of service
  termsOfService:
    externalUrl: 'https://librechat.ai/tos'
    openNewTab: true

  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

rateLimits:
  fileUploads:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60
  conversationsImport:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60

# Definition of custom endpoints
endpoints:
  # Agents endpoint - configured to use Bedrock
  agents:
    recursionLimit: 50
    disableBuilder: false
    # Use Bedrock as the model provider for agents
    model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    modelEndpoint: "bedrock"
    capabilities:
      - "tools"
      - "actions"
      - "file_search"

  # AWS Bedrock - Primary endpoint using IAM credentials
  bedrock:
    availableRegions:
      - "us-east-1"
    streamRate: 35
    titleModel: "anthropic.claude-3-haiku-20240307-v1:0"

  # Disable assistants (requires OpenAI API key)
  assistants:
    disableBuilder: true

  # Disable OpenAI endpoint
  openAI:
    disabled: true

  # Disable Anthropic direct endpoint (use Bedrock instead)
  anthropic:
    disabled: true

  # Disable Google endpoint
  google:
    disabled: true

fileConfig:
  endpoints:
    assistants:
      fileLimit: 5
      fileSizeLimit: 10  # Maximum size for an individual file in MB
      totalSizeLimit: 50  # Maximum total size for all files in a single request in MB
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
    openAI:
      disabled: true  # Disables file uploading to the OpenAI endpoint
    default:
      totalSizeLimit: 20
    YourCustomEndpointName:
      fileLimit: 2
      fileSizeLimit: 5
  serverFileSizeLimit: 100  # Global server file size limit in MB
  avatarSizeLimit: 2  # Limit for user avatar image size in MB
# See the Custom Configuration Guide for more information:
# https://docs.librechat.ai/install/configuration/custom_config.html